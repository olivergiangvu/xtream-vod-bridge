# Version/security monitoring only; never auto-merge or deploy.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: tuesday
      time: '09:00'
      timezone: Asia/Bangkok
    open-pull-requests-limit: 3
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: tuesday
      time: '09:15'
      timezone: Asia/Bangkok
    open-pull-requests-limit: 2
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: tuesday
      time: '09:30'
      timezone: Asia/Bangkok
    open-pull-requests-limit: 2
