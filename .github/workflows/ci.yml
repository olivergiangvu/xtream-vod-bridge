name: CI
on:
  push:
    branches: [main, 'feat/v0.4-admin-console', 'feat/v0.4.1-admin-18450-prefix', 'feat/v0.4.2-password-login-private-relay', 'fix/v0.4.2-safari-form-login', 'fix/v0.4.2-safari-form-origin', 'fix/v0.4.2-safari-null-origin-referrer']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python source
        run: python -m compileall -q app.py admin_ui.py admin_auth.py ops.py scripts tests
      - name: Check browser JavaScript syntax
        run: |
          node --check admin/assets/app.js
          node --check admin/assets/workspace.js
          node --check tests/ui_workspace_smoke.js
          bash -n canary/upgrade_ui_only.sh
          bash -n canary/prepare_stage4_auth.sh
          python -m py_compile canary/stage4b_preflight.py
          python -m py_compile canary/stage4c_sameport_preflight.py
      - name: Run no-network browser JS smoke
        run: node tests/ui_workspace_smoke.js
      - name: Run offline tests
        run: python -m unittest discover -s tests -v
      - name: Verify sensitive local config is not tracked
        run: python scripts/check_repo.py
