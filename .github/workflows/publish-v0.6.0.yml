# One-time publication of v0.6.0 source release. Does NOT deploy to HomeDocker.
# Triggered only by the protected-main merge adding this specific workflow.
name: Publish Xtream Unified v0.6.0
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-v0.6.0.yml

permissions:
  contents: write

concurrency:
  group: publish-xtream-unified-v0.6.0
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'olivergiangvu/xtream-vod-bridge'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout verified source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Preflight immutable release identity
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_REPOSITORY" = "olivergiangvu/xtream-vod-bridge"
          test -s docs/release/GITHUB_RELEASE_v0.6.0.md
          test -s Dockerfile.unified
          grep -Fq 'sha256:7a00ea49da7ff90bcff1823c45b183a779c5ea46424331fa397308c3ab6e1ebd' docs/release/GITHUB_RELEASE_v0.6.0.md
          if gh release view v0.6.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            ref_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v0.6.0" --jq '.object.sha')"
            if [ "$ref_sha" != "$GITHUB_SHA" ]; then
              echo "::error::Existing release tag points to a different commit: refusing to overwrite"
              exit 1
            fi
            echo "Release already exists and matches this commit"
            echo "CREATE_RELEASE=false" >> "$GITHUB_ENV"
          else
            if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v0.6.0" >/dev/null 2>&1; then
              echo "::error::Tag v0.6.0 exists without a release: manual investigation required"
              exit 1
            fi
            echo "CREATE_RELEASE=true" >> "$GITHUB_ENV"
          fi
      - name: Publish final public source release
        if: env.CREATE_RELEASE == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create v0.6.0 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Xtream VOD Unified v0.6.0 — HomeDocker Stable" \
            --notes-file docs/release/GITHUB_RELEASE_v0.6.0.md \
            --latest
          gh release view v0.6.0 --repo "$GITHUB_REPOSITORY" \
            --json tagName,isDraft,isPrerelease,url,targetCommitish \
            --jq '{tagName,isDraft,isPrerelease,url,targetCommitish}'
