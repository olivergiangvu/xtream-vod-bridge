# Add INSIDE the existing HTTPS server { ... } for the same domain as AIOStreams.
# "proxy_pass .../" intentionally strips the /xtream-vod/ prefix.
location ^~ /xtream-vod/ {
    proxy_pass http://127.0.0.1:18767/;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Keep authorization tokens and signed play query string out of access logs.
    access_log off;
    client_max_body_size 1m;
}
