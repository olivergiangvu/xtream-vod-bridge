# Location snippet ONLY: insert these two locations INSIDE the EXISTING
# "server { ... listen 18450 ssl; ... }" nginx block currently handling
# /a/..., /play/... and /health for Xtream VOD Bridge.
#
# DO NOT paste as a new server {}, or into nginx's global http {} context.
# DO NOT change existing 18450 listen, TLS certificates, or stream locations.
# DO NOT use a second port or proxy the Docker admin container via 0.0.0.0.
#
# WARNING: Internet-facing 18450 relies on the source address for this ACL.
# WAN→LAN SNAT/hairpin by the ASUS router may present requests as a LAN IP.
# Confirm the real client IP from outside before trusting this as LAN-only.
# If uncertain, keep the SSH tunnel and add an independent nginx auth layer.
#
# /admin has NO trailing slash. Deliberately not redirected publicly; only
# /admin/ is supported to ensure relative asset/API resolution is correct.
location = /admin {
    return 404;
}

location ^~ /admin/ {
    # Optional: add explicit "deny <router_SNAT_IP>;" BEFORE subnet allows
    # if WAN traffic is source-NATed by the router to a 192.168.50.x address.
    allow 127.0.0.1;
    allow ::1;
    allow 192.168.50.0/24;
    deny all;

    # The trailing slash strips /admin/ when proxying to FastAPI:
    # /admin/api/overview → /api/overview
    # /admin/assets/app.js → /assets/app.js
    # /admin/ → /
    proxy_pass http://127.0.0.1:18768/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For "";
    proxy_set_header Connection "";
    proxy_set_header Authorization $http_authorization;

    # Never record credentials or admin request metadata in access logs.
    access_log off;
    proxy_redirect off;
    proxy_request_buffering on;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;
    client_max_body_size 16k;
    add_header Cache-Control "no-store" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
}
