# OPTIONAL, only after local certificate and .local name resolution are tested.
# Separate LAN hostname on SAME HTTPS PORT 18450, selected by TLS SNI/Host.
# Does not modify the public DDNS server block /a/ or /play/ routes.
#
# Prerequisites:
#  - hostname homedocker.local resolves to 192.168.50.153 inside LAN (Avahi
#    Bonjour/mDNS or explicitly scoped /etc/hosts on trusted clients).
#  - leaf cert SAN DNS:homedocker.local, trusted ONLY on devices that use it.
#  - no ASUS forwarding changes; Docker admin remains 127.0.0.1:18768.
#  - ADMIN_LAN_ORIGIN=https://homedocker.local:18450 in .env for admin container.
#  - proof from a real WAN network that admin hostname is not routable.
#
# Do not include this template until verified; host will validate via nginx -t.
server {
    listen 18450 ssl;
    server_name homedocker.local;

    ssl_certificate /etc/nginx/ssl/xtream-admin-lan/leaf.pem;
    ssl_certificate_key /etc/nginx/ssl/xtream-admin-lan/leaf.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    access_log off;
    client_max_body_size 16k;

    # The public addon remains on the existing DDNS vhost.
    location = /admin { return 404; }
    location ^~ /admin/ {
        allow 127.0.0.1;
        allow 192.168.50.0/24;
        deny all;

        proxy_pass http://127.0.0.1:18768/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Connection "";

        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        add_header Cache-Control "no-store" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
    location / { return 404; }
}
