# Reference only. NEVER enable this file with placeholders intact.
# LAN-only HTTPS reverse proxy for HomeDocker Xtream VOD Bridge ADMIN.
# Nginx runs on the Linux HOST, not in the Docker container.
#
# Replace these exact placeholders before putting it in nginx:
# __LAN_IP__        e.g. 192.168.50.153
# __HTTPS_HOST__    a DNS name resolving to LAN_IP on trusted LAN clients
# __FULLCHAIN__     verified TLS cert chain matching HTTPS_HOST
# __PRIVKEY__       private TLS key (never post contents)
# __LAN_CIDR__      e.g. 192.168.50.0/24
# __HTTPS_PORT__    e.g. 18769, a free host port (not forwarded on router)
#
# Existing bridge port 18767 and local admin port 18768 remain unchanged.
# Keep Docker admin published at 127.0.0.1:18768, NOT 0.0.0.0.
server {
    listen __LAN_IP__:__HTTPS_PORT__ ssl;
    server_name __HTTPS_HOST__;

    ssl_certificate __FULLCHAIN__;
    ssl_certificate_key __PRIVKEY__;
    ssl_protocols TLSv1.2 TLSv1.3;

    allow __LAN_CIDR__;
    deny all;

    # Never log password/token-bearing admin API traffic.
    access_log off;
    error_log /var/log/nginx/xtream-vod-admin-error.log warn;

    # Narrow admin path; no public Stremio playback routes here.
    client_max_body_size 16k;
    proxy_connect_timeout 5s;
    proxy_read_timeout 15s;
    proxy_send_timeout 15s;

    location / {
        proxy_pass http://127.0.0.1:18768;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Connection "";
        add_header Cache-Control "no-store" always;
        add_header Referrer-Policy "no-referrer" always;
    }
}
