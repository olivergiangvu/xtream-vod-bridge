# Optional pilot-only overlay; do not deploy without reviewed DR backup.
# Use with: docker compose -f compose.yaml -f compose.provider-vault.example.yaml ...
# XTREAM_PROVIDER_KEY_HOST_PATH must point to a preexisting private host file.
services:
  xtream-vod-bridge:
    volumes:
      - type: bind
        source: ${XTREAM_PROVIDER_KEY_HOST_PATH:?Set key file path}
        target: /run/secrets/xtream-provider.key
        read_only: true
        bind:
          create_host_path: false
  xtream-vod-admin:
    volumes:
      - type: bind
        source: ${XTREAM_PROVIDER_KEY_HOST_PATH:?Set key file path}
        target: /run/secrets/xtream-provider.key
        read_only: true
        bind:
          create_host_path: false
