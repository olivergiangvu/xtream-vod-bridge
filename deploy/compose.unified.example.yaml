# Reference only: private production.env and image archive are intentionally absent.
name: xtream-vod-unified
services:
  unified:
    image: sha256:7a00ea49da7ff90bcff1823c45b183a779c5ea46424331fa397308c3ab6e1ebd
    pull_policy: never
    container_name: xtream-vod-unified
    restart: unless-stopped
    user: "10001:10001"
    env_file:
      - ./production.env
    ports:
      - "127.0.0.1:18769:8767"
    volumes:
      - xtream_vod_index:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=16m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8767/live',timeout=3)"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 20s
volumes:
  xtream_vod_index:
    external: true
    name: xtream-vod-bridge_xtream_vod_index
